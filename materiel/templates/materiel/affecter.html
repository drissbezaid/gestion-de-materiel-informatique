<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Affecter matériel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h1>Affecter un matériel</h1>

    <form method="POST" class="card p-3 mt-3">
        {% csrf_token %}

        <div class="mb-3">
            <label>Matériel</label>
            <select name="materiel" class="form-control" required>
                {% for m in materiels %}
                    <option value="{{ m.id }}">{{ m.nom }} - {{ m.reference }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label>Personnel</label>
            <select name="personnel" class="form-control" required>
                {% for p in personnels %}
                    <option value="{{ p.id }}">{{ p.nom }}</option>
                {% endfor %}
            </select>
        </div>

        <button class="btn btn-success">Affecter</button>
        <a href="{% url 'materiel_list' %}" class="btn btn-secondary">Retour</a>

    </form>

</div>

</body>
</html>
