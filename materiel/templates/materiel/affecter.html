<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Affecter matériel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #d9e4f5);
        }

        .card {
            border-radius: 15px;
        }

        .form-title {
            font-weight: bold;
            color: #333;
        }

        .btn {
            border-radius: 10px;
        }

        select {
            border-radius: 10px !important;
            padding: 10px;
        }

        select:focus {
            border-color: #198754;
            box-shadow: 0 0 5px rgba(25, 135, 84, 0.3);
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="col-md-6">

        <div class="card shadow-lg p-4">

            <h3 class="text-center form-title mb-4">
                 Affecter un matériel
            </h3>

            <form method="POST">
                {% csrf_token %}

                <!-- Matériel -->
                <div class="mb-3">
                    <label class="form-label"> Matériel</label>
                    <select name="materiel" class="form-control" required>
                        {% for m in materiels %}
                            <option value="{{ m.id }}">{{ m.nom }} - {{ m.reference }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Personnel -->
                <div class="mb-3">
                    <label class="form-label"> Personnel</label>
                    <select name="personnel" class="form-control" required>
                        {% for p in personnels %}
                            <option value="{{ p.id }}">{{ p.nom }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between mt-4">

                    <a href="{% url 'materiel_list' %}" class="btn btn-outline-secondary">
                         Retour
                    </a>

                    <button class="btn btn-success px-4">
                         Affecter
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
