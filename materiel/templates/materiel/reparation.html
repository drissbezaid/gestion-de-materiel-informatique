<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Réparation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #d9e4f5);
        }

        .card {
            border-radius: 15px;
        }

        .form-title {
            font-weight: bold;
            color: #333;
        }

        .btn {
            border-radius: 10px;
        }

        input, select, textarea {
            border-radius: 10px !important;
            padding: 10px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #ffc107; /* jaune pour réparation */
            box-shadow: 0 0 5px rgba(255, 193, 7, 0.4);
        }

        textarea {
            min-height: 120px;
            resize: none;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="col-md-6">

        <div class="card shadow-lg p-4">

            <h3 class="text-center form-title mb-4">
                 Ajouter une réparation
            </h3>

            <form method="POST">
                {% csrf_token %}

                <!-- Matériel -->
                <div class="mb-3">
                    <label class="form-label"> Matériel</label>
                    <select name="materiel" class="form-select" required>
                        {% for m in materiels %}
                            <option value="{{ m.id }}">{{ m.nom }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label"> Description</label>
                    <textarea name="description" class="form-control" placeholder="Décrire la panne..." required></textarea>
                </div>

                <!-- Coût -->
                <div class="mb-3">
                    <label class="form-label"> Coût</label>
                    <input type="number" name="cout" class="form-control" step="0.01" placeholder="0.00" required>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between mt-4">

                    <a href="{% url 'materiel_list' %}" class="btn btn-outline-secondary">
                         Retour
                    </a>

                    <button class="btn btn-warning px-4">
                         Enregistrer
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
