<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer matériel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #d9e4f5);
        }

        .card {
            border-radius: 15px;
        }

        .btn {
            border-radius: 10px;
        }

        .danger-box {
            background: #fff3f3;
            border-left: 5px solid #dc3545;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="col-md-6">

        <div class="card shadow-lg p-4 text-center">

            <h3 class="mb-4 text-danger">
                 Supprimer le matériel
            </h3>

            <div class="danger-box mb-4">
                <p class="mb-2">Vous êtes sur le point de supprimer :</p>

                <h5 class="fw-bold">
                    {{ materiel.nom }} - {{ materiel.reference }}
                </h5>

                <p class="text-danger mt-2 mb-0">
                    Cette action est irréversible !
                </p>
            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="d-flex justify-content-between mt-3">

                    <a href="{% url 'materiel_list' %}" class="btn btn-outline-secondary">
                         Annuler
                    </a>

                    <button class="btn btn-danger px-4">
                         Supprimer
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
