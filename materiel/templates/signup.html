<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 15px;
        }

        .title {
            font-weight: bold;
            text-align: center;
        }

        .form-control {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="card signup-card shadow-lg p-4">

    <h3 class="title mb-4"> Créer un compte</h3>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Username</label>
            {{ form.username }}
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            {{ form.password1 }}
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            {{ form.password2 }}
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Sign Up
        </button>
    </form>

    <div class="text-center mt-3">
        <small>
            Déjà un compte ?
            <a href="{% url 'login' %}">Login</a>
        </small>
    </div>

</div>

</body>
</html>
